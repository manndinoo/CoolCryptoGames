[package]
name = "nmeme-index"
version = "0.1.0"
edition = "2021"
description = "Derive NMEME token identity and rebuild balances from a node's canonical note set"

[dependencies]
nmeme-core = { path = "../nmeme-core" }
nmeme-tx = { path = "../nmeme-tx" }
nockchain-types = { workspace = true }
nockchain-math = { workspace = true }
nockapp = { workspace = true }
nockapp-grpc-proto = { workspace = true }
nockvm = { workspace = true }
noun-serde = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
bytes = { workspace = true }
