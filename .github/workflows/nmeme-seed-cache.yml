# Generate the Nockchain verifier-setup seed cache on a GitHub-hosted runner.
#
# Why: the one phase of node startup this project's cloud environment cannot
# afford is first-boot generation of ai-pow/verifier-setup-seeds-v1.bin — FRI
# proving that was OOM-killed at ~13.9 GB under a 13.34 GiB cgroup. Public-repo
# hosted runners are larger, and a swapfile on /mnt covers the rest. The file
# is consensus-digest-validated by any node that loads it, so where it was
# generated does not matter (nockmeme/scripts/generate-seed-cache.sh).
#
# Output: the tarball as a workflow artifact, and committed to the
# `seed-cache` branch so it can be fetched with plain git.
#
# Run 1 (34543165057) died 52 min into generation with exit 143 and "The
# runner has received a shutdown signal" — no OOM line, nothing uploaded. That
# is what a hosted runner looks like when the job starves the VM of RAM: the
# node thrashed against swap, the runner agent stopped answering, GitHub
# reclaimed the machine. Two changes follow from it:
#   * the node runs in its own cgroup with MemoryMax below physical RAM, so its
#     excess goes to swap while the runner agent keeps ~3 GB of real memory;
#   * progress (RSS samples, node-log tail, free -m) is pushed to the
#     `seed-cache-progress` branch every 5 minutes, so a dead VM leaves evidence.
# Run 2 (34549887736) proved the cgroup works — the runner stayed up — and
# measured what the earlier failures could not: at 4 threads the node reached
# 11.6 GB resident + 26.6 GB swapped (38 GB) and was still climbing when the
# 27.6 GB of swap ran out, 69 minutes in, 14 buckets into a documented ~15 min
# job. Two changes follow from it:
#   * swap is created AFTER the build, from all the disk that is left on /mnt
#     and / rather than a fixed 24 GB;
#   * the job runs as a matrix over RAYON_NUM_THREADS (1 and 2): the per-table
#     proving memory scales with the lane count, so fewer threads should
#     shrink the peak toward RAM; each variant pushes its own progress branch
#     (seed-cache-progress-t<N>) and whichever finishes publishes the cache.
name: nmeme seed cache

on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-wehujv]
    paths: [.github/workflows/nmeme-seed-cache.yml]

permissions:
  contents: write

env:
  NOCKCHAIN_REV: 2bcb0b9dfd190f17252205afd1c8a067048a1ad9
  WORK: /mnt/work

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        threads: [1, 2]
    name: generate (RAYON_NUM_THREADS=${{ matrix.threads }})
    steps:
      - uses: actions/checkout@v4

      - name: Machine facts before anything else
        run: |
          nproc; free -g; df -h / /mnt; uname -m
          cat /proc/sys/vm/overcommit_memory

      - name: Overcommit (the kernel jams reserve 16 GB of address space)
        run: |
          sudo sysctl -w vm.overcommit_memory=1
          sudo sysctl -w vm.swappiness=100

      - name: System deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler clang cmake make pkg-config
          protoc --version

      - name: Clone Nockchain at the pinned revision
        run: |
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          git init -q "$WORK/nockchain" && cd "$WORK/nockchain"
          git remote add origin https://github.com/nockchain/nockchain.git
          git fetch -q --depth 1 origin "$NOCKCHAIN_REV"
          git checkout -q FETCH_HEAD
          git rev-parse HEAD

      - name: Restore the cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /mnt/work/nockchain/target
          key: nmeme-seed-${{ env.NOCKCHAIN_REV }}-${{ runner.os }}-v1

      - name: Build honk and the kernel assets
        working-directory: /mnt/work/nockchain
        run: |
          cargo build --release -p honk --bin honk
          mkdir -p assets/native
          for k in dumb:hoon/apps/dumbnet/outer.hoon miner:hoon/apps/dumbnet/miner.hoon \
                   wal:hoon/apps/wallet/wallet.hoon  peek:hoon/apps/peek/peek.hoon; do
            RUST_LOG=warn ./target/release/honk --new --output "assets/native/${k%%:*}.jam" \
              --prelude hoon/common/hoon.hoon "${k##*:}" hoon
          done
          cp assets/native/*.jam assets/
          ls -la assets/*.jam

      - name: Build the node only
        working-directory: /mnt/work/nockchain
        run: cargo build --release -p nockchain --bin nockchain

      - name: Save the cargo cache now, before generation can fail
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /mnt/work/nockchain/target
          key: nmeme-seed-${{ env.NOCKCHAIN_REV }}-${{ runner.os }}-v1

      - name: Swap on every disk that is left (after the build, so it can take it all)
        run: |
          for mnt in /mnt /; do
            avail=$(df -BG --output=avail "$mnt" | tail -1 | tr -dc 0-9)
            size=$((avail - 6))
            [ "$size" -ge 4 ] || { echo "skip $mnt: only ${avail}G free"; continue; }
            f="${mnt%/}/swapfile"
            sudo fallocate -l "${size}G" "$f" && sudo chmod 600 "$f" && sudo mkswap "$f" >/dev/null && sudo swapon "$f"
            echo "swap: $f ${size}G"
          done
          free -g; df -h / /mnt

      - name: Generate the seed cache (cgroup-confined, RSS sampled, progress pushed)
        env:
          # leave ~3 GB of the runner's 16 GB to the runner agent and the OS;
          # everything above this goes to swap instead of starving the VM
          # (cgroup v2: memory.max with memory.swap.max=max)
          NODE_MEMORY_MAX: 13G
          RAYON_NUM_THREADS: ${{ matrix.threads }}
          PROGRESS_BRANCH: seed-cache-progress-t${{ matrix.threads }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$WORK/run"
          # sample the node's RSS every 15s until generation finishes
          ( while true; do
              P=$(pgrep -x nockchain | head -1) || true
              if [ -n "$P" ]; then
                R=$(awk '/^VmRSS:/{print $2}' /proc/$P/status 2>/dev/null || echo 0)
                S=$(awk '/^VmSwap:/{print $2}' /proc/$P/status 2>/dev/null || echo 0)
                printf '%s\t%s\t%s\n' "$(date +%s)" "$R" "$S" >> "$WORK/run/rss.tsv"
              fi
              sleep 15
            done ) &
          SAMPLER=$!
          # push progress every 5 min so a reclaimed VM still leaves evidence
          PROG="$WORK/progress"
          git init -q "$PROG" && cd "$PROG"
          git config user.name  "nmeme-seed-cache[bot]"
          git config user.email "nmeme-seed-cache@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout -q --orphan "$PROGRESS_BRANCH"
          cd "$GITHUB_WORKSPACE"
          ( while true; do
              sleep 300
              { echo "run: ${{ github.run_id }}  attempt: ${{ github.run_attempt }}  threads: $RAYON_NUM_THREADS  at: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
                echo; free -m; echo; df -h / /mnt; echo
                echo "node cgroup:"; cat /sys/fs/cgroup/nmeme-node/memory.current /sys/fs/cgroup/nmeme-node/memory.swap.current 2>/dev/null || true
              } > "$PROG/status.txt"
              cp "$WORK/run/rss.tsv" "$PROG/rss.tsv" 2>/dev/null || true
              tail -n 200 "$WORK/run/node.log" > "$PROG/node.log.tail" 2>/dev/null || true
              ( cd "$PROG" && git add -A && git commit -qm "progress $(date -u +%H:%M)" && git push -fq origin "$PROGRESS_BRANCH" ) || true
            done ) &
          PUBLISHER=$!
          # the node runs inside its own cgroup so it swaps instead of starving the VM
          echo +memory | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null || true
          sudo mkdir -p /sys/fs/cgroup/nmeme-node
          echo "$NODE_MEMORY_MAX" | sudo tee /sys/fs/cgroup/nmeme-node/memory.max
          echo max | sudo tee /sys/fs/cgroup/nmeme-node/memory.swap.max
          set +e
          sudo -E env "PATH=$PATH" GEN_TIMEOUT=18000 RAYON_NUM_THREADS="$RAYON_NUM_THREADS" \
            bash -c 'echo $$ > /sys/fs/cgroup/nmeme-node/cgroup.procs && exec bash nockmeme/scripts/generate-seed-cache.sh "$0" "$1"' \
            "$WORK/nockchain" "$WORK/run"
          RC=$?
          set -e
          sudo chown -R "$USER" "$WORK/run"
          kill $SAMPLER $PUBLISHER 2>/dev/null || true
          echo "generation exit code: $RC"
          echo "peak RSS:  $(awk -F'\t' '{if($2>m)m=$2}END{printf "%.2f GiB", m/1048576}' "$WORK/run/rss.tsv")"
          echo "peak swap: $(awk -F'\t' '{if($3>m)m=$3}END{printf "%.2f GiB", m/1048576}' "$WORK/run/rss.tsv")"
          echo "cgroup peak: $(cat /sys/fs/cgroup/nmeme-node/memory.peak 2>/dev/null || echo n/a)"
          free -g
          # final progress push regardless of outcome
          cp "$WORK/run/rss.tsv" "$PROG/rss.tsv" 2>/dev/null || true
          tail -n 400 "$WORK/run/node.log" > "$PROG/node.log.tail" 2>/dev/null || true
          { echo "finished with exit code $RC at $(date -u '+%Y-%m-%dT%H:%M:%SZ') (threads: $RAYON_NUM_THREADS)"; free -m; } > "$PROG/status.txt"
          ( cd "$PROG" && git add -A && git commit -qm "final: exit $RC" && git push -fq origin "$PROGRESS_BRANCH" ) || true
          exit $RC

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nmeme-seed-cache-t${{ matrix.threads }}
          path: |
            /mnt/work/run/nmeme-seed-cache.tar.gz
            /mnt/work/run/nmeme-seed-cache.sha256
            /mnt/work/run/rss.tsv
            /mnt/work/run/node.log
          retention-days: 30

      - name: Publish to the seed-cache branch (fetchable with plain git)
        if: success()
        run: |
          git config user.name  "nmeme-seed-cache[bot]"
          git config user.email "nmeme-seed-cache@users.noreply.github.com"
          git checkout --orphan seed-cache
          git rm -rfq . || true
          cp "$WORK/run/nmeme-seed-cache.tar.gz" "$WORK/run/nmeme-seed-cache.sha256" "$WORK/run/rss.tsv" .
          git add nmeme-seed-cache.tar.gz nmeme-seed-cache.sha256 rss.tsv
          git commit -qm "Verifier-setup seed cache for Nockchain $NOCKCHAIN_REV (run ${{ github.run_id }}, RAYON_NUM_THREADS=${{ matrix.threads }})"
          git push -f origin seed-cache

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nmeme-seed-cache-failure-logs-t${{ matrix.threads }}
          path: |
            /mnt/work/run/node.log
            /mnt/work/run/rss.tsv
          if-no-files-found: ignore
